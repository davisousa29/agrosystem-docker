# Produção — usar só no servidor, pelos comandos "make prod-*"
name: colchete

# Configuração comum aos três containers do Laravel (backend, fila, agendador)
x-laravel: &laravel
  image: colchete-backend:prod
  env_file:
    - ../colchete-backend/.env
  environment:
    DB_HOST: postgres
    DB_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379
  volumes:
    # Logs e arquivos gerados pelo Laravel sobrevivem a novos deploys
    - backend_storage:/var/www/html/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - colchete_network
  restart: unless-stopped

services:

  # ── Caddy — HTTPS automático + proxy para o PHP ─────────────────────────────
  caddy:
    build:
      context: ./caddy
      additional_contexts:
        backend: ../colchete-backend
    container_name: colchete_caddy
    environment:
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data       # certificados HTTPS — não pode ser perdido
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - colchete_network
    restart: unless-stopped

  # ── Laravel — API (PHP-FPM) ─────────────────────────────────────────────────
  backend:
    <<: *laravel
    build:
      context: ../colchete-backend
      dockerfile: Dockerfile
      target: production
    container_name: colchete_backend

  # ── Fila — e-mails em segundo plano ─────────────────────────────────────────
  queue:
    <<: *laravel
    container_name: colchete_queue
    user: www-data
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    pull_policy: never

  # ── Agendador — tarefas diárias ─────────────────────────────────────────────
  scheduler:
    <<: *laravel
    container_name: colchete_scheduler
    user: www-data
    command: php artisan schedule:work
    pull_policy: never

  # ── PostgreSQL — sem porta publicada: só a rede interna enxerga ─────────────
  postgres:
    image: postgres:16-alpine
    container_name: colchete_postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - colchete_network
    restart: unless-stopped

  # ── Redis — sem porta publicada ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: colchete_redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - colchete_network
    restart: unless-stopped

networks:
  colchete_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_storage:
  caddy_data:
  caddy_config: